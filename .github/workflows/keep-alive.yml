name: Keep Hugging Face Spaces Alive

on:
  schedule:
    # 每 30 分钟运行一次（UTC）
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping-spaces:
    runs-on: ubuntu-latest
    steps:
      - name: Ping lawvinx-hf
        run: |
          echo "=== lawvinx-hf ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://huggingface.co/spaces/lawvinx/lawvinx-hf)
          echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "HTTP: $HTTP_CODE"
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ] && echo "✅ 在线" || echo "⚠️ 休眠/离线"

      - name: Ping lawvinx-imgbed
        run: |
          echo "=== lawvinx-imgbed ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://huggingface.co/spaces/lawvinx/lawvinx-imgbed)
          echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "HTTP: $HTTP_CODE"
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ] && echo "✅ 在线" || echo "⚠️ 休眠/离线"
