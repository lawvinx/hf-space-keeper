name: Keep Hugging Face Space Alive

on:
  schedule:
    # 每 30 分钟运行一次（UTC 时间）
    # 注意：GitHub Actions 的 cron 使用 UTC 时间
    - cron: '*/30 * * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Hugging Face Space
        run: |
          echo "正在访问 Hugging Face Space..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://huggingface.co/spaces/lawvinx/lawvinx-hf || true)
          echo "访问时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "HTTP 状态码: $HTTP_CODE"
          
          # 如果返回 2xx 或 3xx 都认为是成功的
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✓ Space 访问成功！"
          else
            echo "⚠️  Space 可能处于休眠状态，已尝试唤醒"
          fi
      
      - name: Wait and ping again (wake up sleeped Space)
        run: |
          echo "等待 10 秒后再次访问（确保唤醒）..."
          sleep 10
          curl -s -o /dev/null -w "%{http_code}" https://huggingface.co/spaces/lawvinx/lawvinx-hf || true
          echo ""
          echo "✓ 完成 at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
